name: Territory map
# The map under the territory section (11 November 2026). The streets and
# houses come from OpenStreetMap through Protomaps; the app must not ask a
# foreign map server which streets we look at, so each congregation gets its
# own small extract, kept on our server next to the APK and served from
# https://mycongregation.org/app/maps/<congregation id>.pmtiles.
#
#   map-trial   on a pull request that touches this file: cuts an area of
#               the same size as ours somewhere else and prints its size.
#               Nothing goes anywhere.
#   map-build   by hand (Actions → Territory map → Run): reads, on the server,
#               the box around each congregation's boundary and territories,
#               cuts it, and puts the file in place.
#
# This log is public: it prints sizes and counts, never a box or a place.
on:
  pull_request:
    paths:
      [
        '.github/workflows/map.yml',
        'scripts/map-houses.mjs',
        'scripts/map-places.mjs',
        'scripts/map-streets.mjs',
        'scripts/map-addresses.mjs',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: territory-map
  cancel-in-progress: false

env:
  # A release older than two weeks, checked by the Go checksum database on
  # install — the binary is built from the published source.
  PMTILES_VERSION: v1.31.2
  # Highest zoom Protomaps builds; the map zooms further by enlarging these.
  MAX_ZOOM: '15'
  # About two kilometres around the outermost territory.
  MARGIN: '0.02'

jobs:
  map-trial:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Only for scripts/map-houses.mjs (pmtiles, vector-tile, pbf).
      - name: Install the reader of the map file
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pmtiles
        run: go install github.com/protomaps/go-pmtiles@${PMTILES_VERSION}
      - name: Latest Protomaps build
        id: build
        run: |
          KEY=$(curl -fsS https://build-metadata.protomaps.dev/builds.json | jq -r '[.[] | .key] | sort | last')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Build: $KEY"
      - name: Cut a trial area (same size as ours, elsewhere)
        run: |
          # 0.53 x 0.33 degrees around a larger city: an upper bound for us.
          time ~/go/bin/go-pmtiles extract \
            "https://build.protomaps.com/${{ steps.build.outputs.key }}" trial.pmtiles \
            --bbox=9.20,51.15,9.73,51.48 --maxzoom=${MAX_ZOOM} > extract.log 2>&1 \
            || { tail -5 extract.log; exit 1; }
          ls -l trial.pmtiles | awk '{printf "Trial extract: %.1f MB\n", $5/1048576}'
          ~/go/bin/go-pmtiles show trial.pmtiles | grep -iE 'tile type|min zoom|max zoom|addressed tiles count' || true
      - name: Houses from the trial file
        run: |
          set -euo pipefail
          node scripts/map-houses.mjs trial.pmtiles 9.20,51.15,9.73,51.48 00000000-0000-4000-8000-000000000000 > houses.csv
          n=$(wc -l < houses.csv)
          echo "Houses in the trial area: $n"
          # A small town and its villages: far more than a thousand buildings.
          [ "$n" -gt 1000 ] || { echo "Too few houses: the reader is broken"; exit 1; }
          awk -F, 'NF != 6 { bad++ } END { if (bad) { print bad " malformed lines"; exit 1 } }' houses.csv
          # House numbers: most houses of a German town have one.
          num=$(awk -F, '$6 != ""' houses.csv | wc -l)
          echo "With a house number: $num of $n"
          [ $((num * 100 / n)) -ge 30 ] || { echo "Too few house numbers: the reader is broken"; exit 1; }
          head -3 houses.csv | cut -d, -f2-
      - name: Places from the trial file
        run: |
          set -euo pipefail
          node scripts/map-places.mjs trial.pmtiles 9.20,51.15,9.73,51.48 00000000-0000-4000-8000-000000000000 > places.csv
          n=$(wc -l < places.csv)
          echo "Named places in the trial area: $n"
          # A city has shops, cafés and doctors by the hundred.
          [ "$n" -gt 200 ] || { echo "Too few places: the reader is broken"; exit 1; }
          # Six fields on every line, read as CSV (names hold commas).
          python3 -c "import csv,sys; r=list(csv.reader(open('places.csv'))); bad=[x for x in r if len(x)!=6]; print(len(bad),'malformed'); sys.exit(1 if bad else 0)"
          cut -d, -f3 places.csv | sort | uniq -c | sort -rn | head -12
      - name: Streets from the trial file
        run: |
          set -euo pipefail
          node scripts/map-streets.mjs --self-test
          node scripts/map-streets.mjs trial.pmtiles 9.20,51.15,9.73,51.48 00000000-0000-4000-8000-000000000000 > streets.csv
          n=$(wc -l < streets.csv)
          echo "Streets in the trial area: $n ($(du -h streets.csv | cut -f1))"
          # A city and its villages: thousands of named streets.
          [ "$n" -gt 1000 ] || { echo "Too few streets: the reader is broken"; exit 1; }
          # Nine fields on every line, the lines valid JSON with points in the box.
          python3 - <<'PY'
          import csv, json, sys
          bad = 0
          for r in csv.reader(open('streets.csv')):
              if len(r) != 9: bad += 1; continue
              lines = json.loads(r[8])
              pts = [p for l in lines for p in l]
              if not pts or any(len(l) < 2 for l in lines): bad += 1
          print(bad, 'malformed'); sys.exit(1 if bad else 0)
          PY
          cut -d, -f4 streets.csv | sort | uniq -c | sort -rn | head -8

      # Official addresses of NRW (14 November 2026, trial): does every house
      # find its own street? Another town than ours, of public data only.
      - name: Official addresses (Gebäudereferenzen NW) on a trial town
        env:
          GEBREF: https://www.opengeodata.nrw.de/produkte/geobasis/lk/akt/gebref_txt
          NRW_BOX: 8.45,51.98,8.60,52.06
        run: |
          set -euo pipefail
          node scripts/map-addresses.mjs --self-test
          curl -fsS "$GEBREF/index.json" -o gebref-index.json
          jq -c '.' gebref-index.json | cut -c1-2000
          FILE=$(jq -r '.. | objects | select(has("name")) | .name' gebref-index.json | grep -iE '\.zip$' | awk 'NR==1')
          echo "File: $FILE"
          curl -fsS "$GEBREF/$FILE" -o gebref.zip
          ls -l gebref.zip | awk '{printf "Download: %.1f MB\n", $5/1048576}'
          unzip -o -q gebref.zip -d gebref
          TXT=$(find gebref -iname 'gebref*.txt' ! -iname '*anzahl*' | awk 'NR==1')
          echo "Text: $TXT ($(wc -l < "$TXT") lines)"
          awk 'NR<=2' "$TXT" | cut -c1-200
          node scripts/map-addresses.mjs "$TXT" "$NRW_BOX" 00000000-0000-4000-8000-000000000000 > addresses.csv
          # Six fields on every line, read as CSV (street names may hold commas).
          python3 -c "import csv,sys; r=list(csv.reader(open('addresses.csv'))); bad=[x for x in r if len(x)!=6]; print(len(r),'addresses,',len(bad),'malformed'); sys.exit(1 if bad or len(r) < 1000 else 0)"
          ~/go/bin/go-pmtiles extract "https://build.protomaps.com/${{ steps.build.outputs.key }}" nrw.pmtiles \
            --bbox="$NRW_BOX" --maxzoom=${MAX_ZOOM} > nrw-extract.log 2>&1 || { tail -5 nrw-extract.log; exit 1; }
          node scripts/map-houses.mjs nrw.pmtiles "$NRW_BOX" 00000000-0000-4000-8000-000000000000 > nrw-houses.csv
          node scripts/map-streets.mjs nrw.pmtiles "$NRW_BOX" 00000000-0000-4000-8000-000000000000 > nrw-streets.csv
          node scripts/map-addresses.mjs --compare nrw-houses.csv nrw-streets.csv addresses.csv

  map-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Only for scripts/map-houses.mjs (pmtiles, vector-tile, pbf).
      - name: Install the reader of the map file
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pmtiles
        run: go install github.com/protomaps/go-pmtiles@${PMTILES_VERSION}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'EOF'
          Host myserver
              HostName ${{ secrets.SSH_HOST }}
              User ${{ secrets.SSH_USER }}
              IdentityFile ~/.ssh/deploy_key
              UserKnownHostsFile ~/.ssh/known_hosts
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      # One line per congregation: id,minLon,minLat,maxLon,maxLat. Kept in a
      # file on this runner and never printed.
      - name: Read the areas on the server
        run: |
          ssh myserver "docker exec -i mycongregation-postgres sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -At -F, -v ON_ERROR_STOP=1'" > areas.csv << 'SQL'
          WITH shapes AS (
            SELECT congregation_id, geometry FROM territory_boundaries
            UNION ALL
            SELECT congregation_id, geometry FROM territories WHERE archived_at IS NULL
          ), points AS (
            SELECT s.congregation_id, p
              FROM shapes s,
                   jsonb_path_query(
                     s.geometry,
                     CASE WHEN s.geometry->>'type' = 'MultiPolygon'
                          THEN '$.coordinates[*][*][*]'
                          ELSE '$.coordinates[*][*]' END::jsonpath
                   ) AS p
          )
          SELECT congregation_id,
                 min((p->>0)::float), min((p->>1)::float),
                 max((p->>0)::float), max((p->>1)::float)
            FROM points GROUP BY congregation_id;
          SQL
          echo "Congregations with territories: $(grep -c . areas.csv || true)"

      - name: Latest Protomaps build
        id: build
        run: |
          KEY=$(curl -fsS https://build-metadata.protomaps.dev/builds.json | jq -r '[.[] | .key] | sort | last')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Build: $KEY"

      # The official addresses of NRW (14 November 2026): street, number and
      # point of every main building, Geobasis NRW, dl-de/zero-2.0. Read
      # once for every congregation; when they cannot be had, the old ones
      # stay and the division keeps guessing streets by distance.
      - name: Official addresses (Gebäudereferenzen NW)
        env:
          GEBREF: https://www.opengeodata.nrw.de/produkte/geobasis/lk/akt/gebref_txt
        run: |
          set -uo pipefail
          node scripts/map-addresses.mjs --self-test || exit 1
          if curl -fsS "$GEBREF/index.json" -o gebref-index.json; then
            FILE=$(jq -r '.. | objects | select(has("name")) | .name' gebref-index.json | grep -iE '\.zip$' | awk 'NR==1')
            if [ -n "$FILE" ] && curl -fsS "$GEBREF/$FILE" -o gebref.zip && unzip -o -q gebref.zip -d gebref; then
              TXT=$(find gebref -iname 'gebref*.txt' ! -iname '*anzahl*' | awk 'NR==1')
              [ -n "$TXT" ] && mv "$TXT" gebref.txt && echo "Addresses: $(wc -l < gebref.txt) lines"
            fi
          fi
          [ -f gebref.txt ] || echo "::warning::No official addresses this time; the old ones stay."

      - name: Cut and put in place
        run: |
          set -euo pipefail
          ssh myserver 'mkdir -p /var/www/mycongregation-app/maps'
          n=0
          while IFS=, read -r id x1 y1 x2 y2; do
            [ -n "$id" ] || continue
            # The id comes from our own database; still, only a uuid goes on.
            [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "Skipping a malformed id"; continue; }
            n=$((n+1))
            box=$(awk -v a="$x1" -v b="$y1" -v c="$x2" -v d="$y2" -v m="$MARGIN" \
              'BEGIN { printf "%.5f,%.5f,%.5f,%.5f", a-m, b-m, c+m, d+m }')
            ~/go/bin/go-pmtiles extract \
              "https://build.protomaps.com/${{ steps.build.outputs.key }}" "map-$n.pmtiles" \
              --bbox="$box" --maxzoom=${MAX_ZOOM} > "extract-$n.log" 2>&1 < /dev/null \
              || { echo "Area $n failed"; exit 1; }
            ls -l "map-$n.pmtiles" | awk -v n="$n" '{printf "Area %d: %.1f MB\n", n, $5/1048576}'
            # Every remote command below gets its own standard input: inside
            # this loop ssh would otherwise read the rest of areas.csv.
            # Copy beside, then rename: a reader never sees half a file.
            scp -q "map-$n.pmtiles" "myserver:/var/www/mycongregation-app/maps/$id.pmtiles.part" < /dev/null
            ssh -n myserver "mv /var/www/mycongregation-app/maps/$id.pmtiles.part /var/www/mycongregation-app/maps/$id.pmtiles"
            # The register of houses from the same file, replacing the old
            # one in one transaction (12 November 2026).
            node scripts/map-houses.mjs "map-$n.pmtiles" "$box" "$id" > "houses-$n.csv" < /dev/null
            echo "Area $n: $(wc -l < "houses-$n.csv") houses"
            # The named places (shops, food, services) from the same file,
            # for the list of a business territory (13 November 2026).
            node scripts/map-places.mjs "map-$n.pmtiles" "$box" "$id" > "places-$n.csv" < /dev/null
            echo "Area $n: $(wc -l < "places-$n.csv") places"
            # The named streets, for dividing a territory between groups
            # (13 November 2026).
            node scripts/map-streets.mjs "map-$n.pmtiles" "$box" "$id" > "streets-$n.csv" < /dev/null
            echo "Area $n: $(wc -l < "streets-$n.csv") streets"
            # The official addresses in the same box (14 November 2026).
            if [ -f gebref.txt ]; then
              node scripts/map-addresses.mjs gebref.txt "$box" "$id" > "addresses-$n.csv" < /dev/null
              echo "Area $n: $(wc -l < "addresses-$n.csv") addresses"
            fi
            {
              echo "BEGIN;"
              echo "DELETE FROM map_houses WHERE congregation_id = '$id';"
              echo "COPY map_houses (congregation_id, osm_id, lon, lat, area_m2, numbers) FROM STDIN WITH (FORMAT csv);"
              cat "houses-$n.csv"
              echo '\.'
              echo "DELETE FROM map_places WHERE congregation_id = '$id';"
              echo "COPY map_places (congregation_id, osm_id, kind, name, lon, lat) FROM STDIN WITH (FORMAT csv);"
              cat "places-$n.csv"
              echo '\.'
              echo "DELETE FROM map_streets WHERE congregation_id = '$id';"
              echo "COPY map_streets (congregation_id, street_no, name, kind, west, south, east, north, lines) FROM STDIN WITH (FORMAT csv);"
              cat "streets-$n.csv"
              echo '\.'
              if [ -f "addresses-$n.csv" ]; then
                echo "DELETE FROM map_addresses WHERE congregation_id = '$id';"
                echo "COPY map_addresses (congregation_id, oid, lon, lat, number, street) FROM STDIN WITH (FORMAT csv);"
                cat "addresses-$n.csv"
                echo '\.'
              fi
              # Only homes count (14 November 2026): garages and sheds without
              # an address of their own are marked (migration MapHomes).
              echo "SELECT 'Area $n: not homes ' || mark_homes('$id');"
              echo "INSERT INTO territory_settings (congregation_id, houses_built_at) VALUES ('$id', now()) ON CONFLICT (congregation_id) DO UPDATE SET houses_built_at = now();"
              echo "COMMIT;"
            } | ssh myserver "docker exec -i mycongregation-postgres sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -qAt -v ON_ERROR_STOP=1'"
            # Tell the app the file is there (it asks for it only then).
            ssh myserver "docker exec -i mycongregation-postgres sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -qAt -v ON_ERROR_STOP=1'" \
              <<< "INSERT INTO territory_settings (congregation_id, map_built_at) VALUES ('$id', now()) ON CONFLICT (congregation_id) DO UPDATE SET map_built_at = now();"
          done < areas.csv
          echo "Maps in place: $n"

      - name: Cleanup
        if: always()
        run: rm -rf ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config areas.csv houses-*.csv places-*.csv streets-*.csv addresses-*.csv gebref.txt gebref.zip gebref
